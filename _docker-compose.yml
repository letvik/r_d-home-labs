services:
  web:
    image: nginx:latest
    expose:
      - "8080" # expose to internal Docker network
    ports:
      - "8080:80"

    volumes:
      - ./web-data:/usr/share/nginx/html:ro
      - ./web-data/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - appnet

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - appnet

  cache:
    image: redis:latest
    ports:
      - 6379:6379

volumes:
  db-data:
  web-data:

networks:
  appnet:

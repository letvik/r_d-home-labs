services:
  web:
    image: nginx:latest
    expose:
      - "80"
    volumes:
      - ./web-data:/usr/share/nginx/html:ro
    networks:
      - appnet

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - appnet

  cache:
    image: redis:latest
    ports:
      - 6379:6379
    networks:
      - appnet

  nginx:
    image: nginx:latest
    volumes:
      - ./web-data/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
    networks:
      - appnet

volumes:
  db-data:

networks:
  appnet:
